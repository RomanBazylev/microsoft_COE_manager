name: SF Auto-Poster

on:
  schedule:
    - cron: "0 8 * * 1-5"      # Weekdays 08:00 UTC — all channels
    - cron: "0 8 * * 0,6"      # Weekends 08:00 UTC — official sources only
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — log only, do NOT post to Teams"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      channels_filter:
        description: "Channels to run (comma-separated, leave blank for all)"
        required: false
        default: ""
        type: string

concurrency:
  group: sf-autoposter
  cancel-in-progress: false

jobs:
  run-autoposter:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run reliability tests
        run: python -m unittest discover -s tests -v

      - name: Determine channels filter
        id: channels
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "filter=${{ github.event.inputs.channels_filter }}" >> $GITHUB_OUTPUT
            echo "official_only=false" >> $GITHUB_OUTPUT
          else
            DAY=$(date -u +%u)   # 1=Mon ... 7=Sun
            if [ "$DAY" = "6" ] || [ "$DAY" = "7" ]; then
              echo "filter=salesforce-rss" >> $GITHUB_OUTPUT
              echo "official_only=true" >> $GITHUB_OUTPUT
            else
              echo "filter=" >> $GITHUB_OUTPUT
              echo "official_only=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run pipeline
        env:
          DRY_RUN:        ${{ github.event.inputs.dry_run || 'false' }}
          CHANNELS_FILTER: ${{ steps.channels.outputs.filter }}
          OFFICIAL_ONLY:   ${{ steps.channels.outputs.official_only }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GEMINI_API_KEY:                 ${{ secrets.GEMINI_API_KEY }}
          TEAMS_WEBHOOK_CERTIFICATION:    ${{ secrets.TEAMS_WEBHOOK_CERTIFICATION }}
          TEAMS_WEBHOOK_PLAYGROUND:       ${{ secrets.TEAMS_WEBHOOK_PLAYGROUND }}
          TEAMS_WEBHOOK_SALESFORCE_RSS:   ${{ secrets.TEAMS_WEBHOOK_SALESFORCE_RSS }}
          TEAMS_WEBHOOK_NEED_HELP:        ${{ secrets.TEAMS_WEBHOOK_NEED_HELP }}
          TEAMS_WEBHOOK_MEETUP_EVENTS:    ${{ secrets.TEAMS_WEBHOOK_MEETUP_EVENTS }}
          TEAMS_WEBHOOK_TOPIC_OF_THE_DAY: ${{ secrets.TEAMS_WEBHOOK_TOPIC_OF_THE_DAY }}
        run: python src/main.py || exit 1

      - name: Sync dashboard artifacts
        run: |
          mkdir -p docs
          cp data/post_log.json docs/post_log.json
          cp data/last_run.json docs/last_run.json
          cp data/feed_health.json docs/feed_health.json

      - name: Clean up tip PNGs older than 30 days
        run: |
          find docs -name "tip_*.png" -mtime +30 -print -delete || true
          echo "Cleanup done (kept last 30 days of tip cards)"

      - name: Commit data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/post_log.json data/seen_ids.json data/tip_used_ids.json data/last_run.json data/feed_health.json
          git add docs/post_log.json docs/last_run.json docs/feed_health.json docs/tip_*.png
          git add -u docs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "bot: update post log + tip card [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
